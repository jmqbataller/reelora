name: Reelora Skill Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "SKILL.md"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_CHECKLIST.md"
      - "docs/**"
      - "agents/**"
      - "assets/**"
      - "skill/**"
      - "src/**"
      - "scripts/build-skill-package.mjs"
      - ".github/workflows/release-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check backend
        run: npm run check

      - name: Build backend
        run: npm run build

      - name: Test premium effects and FFmpeg compatibility
        run: npm test

      - name: Build ChatGPT Skill ZIP
        run: npm run pack:skill

      - name: Verify ZIP structure
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="dist-skill/reelora-skill-v${VERSION}.zip"
          python3 - "$ZIP" "$VERSION" <<'PY'
          import json, sys, zipfile

          archive, expected_version = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              required = {
                  "reelora/SKILL.md",
                  "reelora/agents/openai.yaml",
                  "reelora/assets/icon.svg",
                  "reelora/manifest.json",
                  "reelora/references/MUSIC_AND_TRANSITIONS.md",
                  "reelora/references/AI_VIDEO_REMIX_AND_REFRAME.md",
                  "reelora/scripts/check_reelora_runtime.py",
                  "reelora/scripts/reelora_edit.py"
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"Missing required skill files: {sorted(missing)}")

              manifest = json.loads(z.read("reelora/manifest.json"))
              if manifest.get("version") != expected_version:
                  raise SystemExit(
                      f"Manifest version {manifest.get('version')} does not match package version {expected_version}"
                  )
              fallback = manifest.get("executableFallback", {})
              if fallback.get("script") != "scripts/reelora_edit.py":
                  raise SystemExit("Manifest does not point to executable Reelora editor")

              surface = manifest.get("surfaceCompatibility", {})
              if not surface.get("ordinaryChat") or not surface.get("implicitInvocation"):
                  raise SystemExit("Manifest does not declare ordinary Chat compatibility")

              metadata = z.read("reelora/agents/openai.yaml").decode("utf-8")
              for required_text in (
                  'display_name: "Reelora"',
                  'default_prompt: "Use $reelora',
                  'allow_implicit_invocation: true',
              ):
                  if required_text not in metadata:
                      raise SystemExit(f"Missing Chat skill metadata: {required_text}")

              print(f"Verified {archive} with {len(names)} files; version={expected_version}")
          PY

      - name: Prepare release notes from changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)

          if match:
              body = match.group(0).strip()
          else:
              body = (
                  f"## Reelora v{version}\n\n"
                  "Preservation-first automatic Reel director and ChatGPT Skill.\n"
              )

          body += (
              "\n\n### Download\n\n"
              f"Download `reelora-skill-v{version}.zip` from the release assets and upload/install it "
              "from the ChatGPT Skills interface available to your account/workspace.\n"
          )
          pathlib.Path("/tmp/reelora-release-notes.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ZIP="dist-skill/reelora-skill-v${VERSION}.zip"

          if [ "$VERSION" = "0.7.3" ]; then
            TITLE="Reelora v${VERSION} – Chat + Work Compatibility"
          elif [ "$VERSION" = "0.7.2" ]; then
            TITLE="Reelora v${VERSION} – Genuine AI Video Re-Edit"
          elif [ "$VERSION" = "0.7.1" ]; then
            TITLE="Reelora v${VERSION} – All Uploaded Videos Fix"
          elif [ "$VERSION" = "0.7.0" ]; then
            TITLE="Reelora v${VERSION} – AI Video Remix + Auto 9:16 Reframe"
          elif [ "$VERSION" = "0.6.0" ]; then
            TITLE="Reelora v${VERSION} – Premium Transitions + Real-Pixel Animation"
          elif [ "$VERSION" = "0.5.1" ]; then
            TITLE="Reelora v${VERSION} – Executable Music Replacement + Cleaner Beat Cuts"
          elif [ "$VERSION" = "0.5.0" ]; then
            TITLE="Reelora v${VERSION} – Trend-Inspired Music + Subtle Flash Accents"
          else
            TITLE="Reelora v${VERSION}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/reelora-release-notes.md
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/reelora-release-notes.md
          fi
